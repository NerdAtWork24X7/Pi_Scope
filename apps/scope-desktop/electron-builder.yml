appId: com.piscope.app
productName: Pi Scope
copyright: Copyright © 2026 Pi Scope
afterPack: after-pack.cjs
directories:
  output: dist
  buildResources: .
files:
  - main.js
  - scope-control.js
  - preload.js
  - package.json
  - server-bundle/**/*
  - node_modules/**/*
asar: false
publish: null
extraResources:
  - from: node-portable
    to: node
  # The Pi coding agent bundled with Pi Scope. The server installs a `pi` shim
  # from here that every spawned process uses instead of a global pi install.
  - from: pi-bundle
    to: pi
    filter:
      - "**/*"
      - "!package-lock.json"
linux:
  target:
    - AppImage
  category: Development
  icon: server-bundle/icon.png
  artifactName: Pi-Scope-${version}.AppImage
  executableName: pi-scope
# Windows: an NSIS installer, built ON Windows (`npx electron-builder --win`
# from this directory, with server-bundle/ populated) so node-pty and the
# portable Node in node-portable/ match the host. after-pack.cjs is a no-op
# there — the SUID-sandbox wrapper it writes is a Linux thing only.
win:
  target:
    - nsis
  icon: server-bundle/icon.png
  artifactName: Pi-Scope-Setup-${version}.exe
